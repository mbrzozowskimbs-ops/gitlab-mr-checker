name: Firefox release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require release commit on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$RELEASE_TAG" origin/main; then
            echo "Release tag $RELEASE_TAG does not point to a commit merged into main."
            exit 1
          fi

      - name: Check Firefox release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('node:fs');
            const tag = process.env.RELEASE_TAG;
            const pom = fs.readFileSync('pom.xml', 'utf8').match(/<version>([^<]+)<\\/version>/)?.[1];
            const firefox = JSON.parse(fs.readFileSync('browsers/firefox/manifest.json', 'utf8')).version;
            if (!/^v\\d+\\.\\d+\\.\\d+$/.test(tag)) throw new Error('Tag must look like vX.Y.Z');
            if (pom !== tag.slice(1) || firefox !== tag.slice(1)) {
              throw new Error('Tag and versions in pom.xml and Firefox manifest must match');
            }
          "

      - name: Run tests
        run: node --test tests/*.test.cjs

      - name: Build Firefox package
        run: |
          node scripts/build.cjs firefox
          mkdir -p target
          (cd dist/firefox && zip -qr "../../target/gitlab-mr-checker-${GITHUB_REF_NAME#v}-firefox.zip" .)

      - name: Store Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: firefox-package
          path: target/*-firefox.zip
          if-no-files-found: error

  submit-amo:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download Firefox package
        uses: actions/download-artifact@v4
        with:
          name: firefox-package
          path: target

      - name: Extract Firefox package
        run: unzip -q target/*-firefox.zip -d dist/firefox

      - name: Submit version to Firefox Add-ons
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets are required."
            exit 1
          fi
          npx --yes web-ext@10 sign \
            --source-dir dist/firefox \
            --artifacts-dir target/amo \
            --channel listed \
            --approval-timeout 0 \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

  github-release:
    needs: [build, submit-amo]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Firefox package
        uses: actions/download-artifact@v4
        with:
          name: firefox-package
          path: target

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package="target/gitlab-mr-checker-${RELEASE_TAG#v}-firefox.zip"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$package" --clobber
          else
            gh release create "$RELEASE_TAG" "$package" --verify-tag --generate-notes
          fi

name: Firefox release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: firefox-release-main
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: node --test tests/*.test.cjs

      - name: Check Firefox release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/prepare-release.cjs

  sign:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check existing tag target
        run: |
          # The peeled ref (^{}) of an annotated tag sorts last and names its commit.
          tag_commit=$(git ls-remote origin "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}" | sort -k2 | tail -n1 | cut -f1)
          if [ -n "$tag_commit" ] && [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "Existing tag v$VERSION points to another commit."
            exit 1
          fi

      - name: Build Firefox package
        run: |
          node scripts/build.cjs firefox
          mkdir -p target
          (cd dist/firefox && zip -qr "../../target/gitlab-mr-checker-$VERSION-firefox.zip" .)

      # Stored before contacting AMO, so a failed signing still leaves the ZIP for manual recovery.
      - name: Store Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: firefox-package
          path: target/gitlab-mr-checker-*-firefox.zip
          if-no-files-found: error

      # Unlisted versions get only automated review, so waiting for the signed XPI usually takes minutes.
      - name: Sign unlisted version in Firefox Add-ons
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@10 sign \
            --source-dir dist/firefox \
            --artifacts-dir target/amo \
            --channel unlisted \
            --approval-timeout 3600000 \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"
          mv target/amo/*.xpi "target/gitlab-mr-checker-$VERSION-firefox.xpi"

      - name: Store signed XPI
        uses: actions/upload-artifact@v4
        with:
          name: firefox-xpi
          path: target/gitlab-mr-checker-*-firefox.xpi
          if-no-files-found: error

  github-release:
    needs: [check, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Firefox package and signed XPI
        uses: actions/download-artifact@v4
        with:
          pattern: firefox-*
          merge-multiple: true
          path: target

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          files=("target/gitlab-mr-checker-$VERSION-firefox.zip" "target/gitlab-mr-checker-$VERSION-firefox.xpi")
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "${files[@]}" --clobber
          else
            gh release create "v$VERSION" "${files[@]}" --target "$GITHUB_SHA" --generate-notes
          fi
